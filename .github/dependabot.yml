version: 2
updates:
  # Gradle plugins and libraries from gradle/libs.versions.toml.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      # One PR for all non-major bumps keeps the noise down; majors (AGP, Kotlin) come alone.
      minor-and-patch:
        update-types: [minor, patch]
    # Pre-releases (Health Connect alphas etc.) are never proposed while the pinned version is stable.

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
