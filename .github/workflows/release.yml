name: Release

# Tag a commit `vX.Y.Z` and push the tag: this builds a signed release APK and attaches it to a
# GitHub release. Needs repository secrets (see README "Releases"):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and optionally
#   ANDROID_KEY_PASSWORD (defaults to the keystore password, as in a PKCS12 keystore).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - name: Decode keystore
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Build signed release APK
        run: ./gradlew assembleRelease testDebugUnitTest --no-daemon
        env:
          # app/build.gradle.kts reads these; without them the release build is unsigned.
          WS_RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          WS_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          WS_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          WS_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          WS_VERSION_NAME: ${{ github.ref_name }}

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "wanderer-sync-${GITHUB_REF_NAME}.apk"

      - name: Create GitHub release with APK
        uses: softprops/action-gh-release@v3
        with:
          files: wanderer-sync-${{ github.ref_name }}.apk
          generate_release_notes: true
